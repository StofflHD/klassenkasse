{# Formularfelder einer Schülerin / eines Schülers; s = Datensatz oder none #}
<label class="wide">Name <input name="name" value="{{ s.name if s }}" maxlength="100" required></label>
<label>Geburtstag <input type="date" name="birthday" value="{{ s.birthday or '' if s }}"></label>
<label class="wide">Straße <input name="street" value="{{ s.street if s }}" maxlength="120" autocomplete="off"></label>
<label>PLZ <input name="zip" value="{{ s.zip if s }}" maxlength="10" inputmode="numeric" autocomplete="off"></label>
<label>Ort <input name="city" value="{{ s.city if s }}" maxlength="80" autocomplete="off"></label>
{% for n in (1, 2) %}
<fieldset class="wide guardian">
  <legend>Erziehungsberechtigte/r {{ n }}</legend>
  <div class="grid">
    <label class="wide">Name <input name="g{{ n }}_name" value="{{ s['g%d_name' % n] if s }}" maxlength="100" autocomplete="off" placeholder="Vor- und Nachname"></label>
    <label class="wide">Telefon <input type="tel" name="g{{ n }}_phone" value="{{ s['g%d_phone' % n] if s }}" maxlength="80" autocomplete="off" placeholder="Festnetz oder mobil; mehrere mit / trennen"></label>
    <label class="wide">E-Mail <input name="g{{ n }}_email" value="{{ s['g%d_email' % n] if s }}" maxlength="120" inputmode="email" autocomplete="off"></label>
    <label class="wide">Anschrift, falls abweichend <input name="g{{ n }}_address" value="{{ s['g%d_address' % n] if s }}" maxlength="200" autocomplete="off" placeholder="Straße, PLZ Ort"></label>
  </div>
</fieldset>
{% endfor %}
<label class="wide">Notiz <textarea name="notes" rows="2" maxlength="500">{{ s.notes if s }}</textarea></label>
