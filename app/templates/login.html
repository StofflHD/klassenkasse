{% extends "base.html" %}
{% block title %}Anmelden – {{ klasse }}{% endblock %}
{% block content %}
<div class="login card">
  <img class="login-logo" src="{{ url_for('static', filename='logo.svg') }}" alt="" width="64" height="64">
  <h1>{{ klasse }}</h1>
  {% if no_users %}
  <p class="hint">Noch kein Benutzer angelegt. Im Container ausführen:<br>
    <code>klassenkasse-admin create-user admin</code></p>
  {% endif %}
  <form method="post">
    {{ csrf_field }}
    <label>Benutzername <input name="username" autocomplete="username" required autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Anmelden</button>
  </form>
</div>
{% endblock %}
