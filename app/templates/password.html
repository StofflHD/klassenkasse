{% extends "base.html" %}
{% block title %}Passwort ändern – {{ klasse }}{% endblock %}
{% block content %}
<div class="login card">
  <h1>Passwort ändern</h1>
  <form method="post">
    {{ csrf_field }}
    <label>Bisheriges Passwort <input name="old" type="password" autocomplete="current-password" required></label>
    <label>Neues Passwort (min. 8 Zeichen) <input name="new" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Neues Passwort wiederholen <input name="new2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button>Speichern</button>
  </form>
</div>
{% endblock %}
