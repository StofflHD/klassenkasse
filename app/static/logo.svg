<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Klassenkasse">
  <title>Klassenkasse</title>
  <defs>
    <linearGradient id="kk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38a585"/>
      <stop offset="1" stop-color="#1f6f5c"/>
    </linearGradient>
  </defs>
  <!-- Kachel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#kk-bg)"/>
  <!-- Münze mit Euro-Zeichen -->
